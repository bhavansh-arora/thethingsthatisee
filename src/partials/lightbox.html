<dialog class="lightbox" data-lightbox aria-label="Photo viewer">
  <div class="lightbox-stage" data-lightbox-stage></div>
  <p class="lightbox-caption"><span data-lightbox-caption></span> <span class="lightbox-count" data-lightbox-count></span></p>
  <button class="lightbox-btn lightbox-close" type="button" data-lightbox-close aria-label="Close">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <button class="lightbox-btn lightbox-prev" type="button" data-lightbox-prev aria-label="Previous photo">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <button class="lightbox-btn lightbox-next" type="button" data-lightbox-next aria-label="Next photo">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M8 4l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
</dialog>

<dialog class="lightbox" data-lightbox aria-label="Photo viewer">
  <div class="lightbox__bar">
    <span class="lightbox__count" data-lightbox-count></span>
    <span class="lightbox__caption" data-lightbox-caption></span>
    <button class="icon-btn" type="button" data-lightbox-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="lightbox__stage" data-lightbox-stage></div>
  <div class="lightbox__nav">
    <button class="icon-btn" type="button" data-lightbox-prev aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="icon-btn" type="button" data-lightbox-next aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</dialog>

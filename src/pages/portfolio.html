<section class="page-hero" style="padding-bottom:0">
  <div class="container">
    <div class="page-hero-head" style="margin-bottom:0">

      </div>
      <p class="lede">A selection from weddings, engagements, families and seniors. Tap any photo to see it full size.</p>
    </div>
  </div>
</section>

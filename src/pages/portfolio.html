<section class="print-hero print-hero--compact">
  <div class="leak leak--rose" aria-hidden="true"></div>
  <div class="leak leak--amber" aria-hidden="true"></div>
  <div class="container print-hero-grid">
    <div class="print-hero-copy">
      <p class="kicker">Portfolio</p>
      <h1 class="h1">Every photo tells a <em>story.</em></h1>
      <p class="lede">A selection from weddings, engagements, families and seniors. Tap any photo to see it full size.</p>
    </div>
    <div class="collage" aria-hidden="true">
      <div class="collage-item" style="--x:18%;--y:2%;--w:54%;--z:2" data-speed=".05"><figure class="print drop tape" style="--r:-3deg;--ar:4/5" data-delay="0"><div class="frame"><x-img name="columns-kiss" sizes="(min-width: 960px) 26vw, 50vw" eager></x-img></div><figcaption>weddings</figcaption></figure></div>
      <div class="collage-item" style="--x:0%;--y:46%;--w:40%;--z:3" data-speed=".12"><figure class="print drop tape" style="--r:-9deg;--ar:1/1" data-delay="160"><div class="frame"><x-img name="flatirons-laugh" sizes="(min-width: 960px) 26vw, 50vw" eager></x-img></div><figcaption>engagements</figcaption></figure></div>
      <div class="collage-item" style="--x:60%;--y:40%;--w:40%;--z:4" data-speed=".16"><figure class="print drop tape" style="--r:7deg;--ar:4/5" data-delay="320"><div class="frame"><x-img name="meadow-dress" sizes="(min-width: 960px) 26vw, 50vw" eager></x-img></div><figcaption>seniors</figcaption></figure></div>
    </div>
  </div>
</section>

<section class="darkroom" data-darkroom aria-label="The darkroom: photographs developing in a tray">
  <canvas class="darkroom-canvas" aria-hidden="true"></canvas>
  <div class="darkroom-fallback"><x-img name="father-of-bride" sizes="100vw"></x-img></div>
  <ul hidden><li data-darkroom-src="assets/img/father-of-bride-1600.webp" data-darkroom-src-sm="assets/img/father-of-bride-960.webp" data-caption="down the aisle"></li><li data-darkroom-src="assets/img/rain-kiss-1600.webp" data-darkroom-src-sm="assets/img/rain-kiss-960.webp" data-caption="rain on brick"></li><li data-darkroom-src="assets/img/autumn-family-1500.webp" data-darkroom-src-sm="assets/img/autumn-family-960.webp" data-caption="autumn family"></li><li data-darkroom-src="assets/img/leaves-portrait-1600.webp" data-darkroom-src-sm="assets/img/leaves-portrait-960.webp" data-caption="senior year"></li><li data-darkroom-src="assets/img/cowboy-couple-1600.webp" data-darkroom-src-sm="assets/img/cowboy-couple-960.webp" data-caption="the hillside"></li><li data-darkroom-src="assets/img/orthodox-ceremony-1600.webp" data-darkroom-src-sm="assets/img/orthodox-ceremony-960.webp" data-caption="beneath the icons"></li><li data-darkroom-src="assets/img/meadow-dress-1600.webp" data-darkroom-src-sm="assets/img/meadow-dress-960.webp" data-caption="the meadow"></li><li data-darkroom-src="assets/img/embrace-bw-1600.webp" data-darkroom-src-sm="assets/img/embrace-bw-960.webp" data-caption="close"></li></ul>
  <div class="darkroom-ui">
    <div class="container darkroom-top">
      <div class="stack">
        <p class="eyebrow">Developing now</p>
        <h2 class="h2">Step into the <em>darkroom.</em></h2>
      </div>
      <p class="safelight"><i></i>Safelight on</p>
    </div>
    <div class="container darkroom-bottom">
      <p class="darkroom-hint">Move through the developer. Tap for the next print.</p>
      <div class="darkroom-meta">
        <p class="darkroom-caption" data-darkroom-caption aria-live="polite"></p>
        <p class="darkroom-count" data-darkroom-count></p>
        <button class="darkroom-next" type="button" data-darkroom-next aria-label="Develop the next print"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>
  </div>
</section>
